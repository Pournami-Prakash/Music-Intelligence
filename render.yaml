# Render blueprint for the Atlas backend (free tier, Docker).
# Deploy: Render → New → Blueprint → connect this repo → apply.
# Then set the secret values (sync:false vars) in the dashboard.
#
# Notes:
#  - Free instances have 512 MB RAM and spin down after ~15 min idle. Startup
#    begins warming the small critical lookups in the background; /ready exposes
#    progress and the frontend pings it immediately. Large full-search/vector
#    fallback artifacts remain lazy. See deploy/LINUX_LOADTEST.md.
#  - The image is already tuned for 512 MB (DUCKDB_MAX_CONCURRENCY=1, jemalloc,
#    503 load-shedding) via the Dockerfile ENV.
services:
  - type: web
    name: music-intelligence-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SKIP_STARTUP_WARMUP
        value: "0"
      - key: MAX_INFLIGHT_REQUESTS
        value: "4"
      - key: REQUEST_ACQUIRE_TIMEOUT
        value: "2"
      # ── set these in the Render dashboard (Environment tab) ──
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://music-intelligence-blue.vercel.app
